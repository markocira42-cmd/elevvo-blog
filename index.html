<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Mark Ocira">
    <meta name="title" content="Personal Blog Homepage">
    <meta name="description" content="personal blog homepage, blog, homepage, elevvo pathways internship task 4">

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

<body>
    <header>
        <h1 class="logo">The DevLog &lt;/&gt;</h1>
    </header>
    <main>
        <section class="controls">
            <h3>
                <label for="search-input">Search Posts:</label>   
            </h3>
            <div class="search-bar">
                <label for="search-input" class="search-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" style="height: 30px;"><!--! Font Awesome Free 7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free (Icons: CC BY 4.0, Fonts: SIL OFL 1.1, Code: MIT License) Copyright 2025 Fonticons, Inc. --><path fill="currentColor" d="M480 272C480 317.9 465.1 360.3 440 394.7L566.6 521.4C579.1 533.9 579.1 554.2 566.6 566.7C554.1 579.2 533.8 579.2 521.3 566.7L394.7 440C360.3 465.1 317.9 480 272 480C157.1 480 64 386.9 64 272C64 157.1 157.1 64 272 64C386.9 64 480 157.1 480 272zM272 416C351.5 416 416 351.5 416 272C416 192.5 351.5 128 272 128C192.5 128 128 192.5 128 272C128 351.5 192.5 416 272 416z"></path></svg>
                </label>
                <input type="text" id="search-input" placeholder="Search posts..." aria-label="Search blog posts">
            </div>

            <div class="filter-buttons">
                <h3>Filter:</h3>
                <button class="filter-btn" data-category="all">All</button>
                <button class="filter-btn" data-category="tech">Tech</button>
                <button class="filter-btn" data-category="travel">Travel</button>
                <button class="filter-btn" data-category="food">Food</button>
            </div>
        </section>

        <section id="blog-grid"></section>
    </main>
    <footer>
        <p>The DevLog &copy; Copyright 2026.</p>
    </footer>
</body>
</html>
