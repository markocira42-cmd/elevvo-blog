<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Mark Ocira">
    <meta name="title" content="Personal Blog Homepage">
    <meta name="description" content="personal blog homepage, blog, homepage, elevvo pathways internship task 4">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"  href="assets/icons/font-awesome-library/webfonts-css/all.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1 class="logo">The DevLog &lt;/&gt;</h1>
    </header>
    <main>
        <section class="controls">
            <h3>
                <label for="search-input">Search Posts:</label>   
            </h3>
            <div class="search-bar">
                <label for="search-input" class="search-icon">
                    <i class="fas fa-search"></i>
                </label>
                <input type="text" id="search-input" placeholder="Search posts...">
            </div>

            <div class="filter-buttons">
                <h3>Filter:</h3>
                <button class="filter-btn current" data-category="all">All</button>
                <button class="filter-btn" data-category="tech">Tech</button>
                <button class="filter-btn" data-category="travel">Travel</button>
                <button class="filter-btn" data-category="food">Food</button>
            </div>
        </section>

        <section id="blog-grid"></section>
    </main>
    <footer>
        <p>The DevLog &copy; Copyright 2026.</p>
    </footer>
</body>
</html>
